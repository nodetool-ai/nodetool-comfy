name: ComfyUI Integration Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Cache models
      uses: actions/cache@v3
      with:
        path: models/checkpoints
        key: ${{ runner.os }}-models-sd-tiny
        restore-keys: |
          ${{ runner.os }}-models-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install huggingface_hub with CLI tools
        pip install "huggingface_hub[cli]"
        # Install nodetool-core from GitHub
        pip install git+https://github.com/nodetool-ai/nodetool.git@main
        # Install PyTorch CPU version
        pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
        # Install other core dependencies
        pip install pydantic einops transformers safetensors aiohttp pyyaml scipy tqdm psutil
    
    - name: Download sd-tiny model
      run: |
        mkdir -p models/checkpoints
        if [ ! -f models/checkpoints/sd_tiny.safetensors ]; then
          echo "Downloading sd-tiny model using Python API..."
          python -c "
from huggingface_hub import hf_hub_download
import os
print('Downloading sd-tiny model from HuggingFace...')
try:
    file_path = hf_hub_download(
        repo_id='segmind/sd-tiny',
        filename='sd_tiny.safetensors',
        local_dir='models/checkpoints',
        local_dir_use_symlinks=False
    )
    print(f'✓ Downloaded successfully to: {file_path}')
    print(f'✓ File size: {os.path.getsize(file_path) / 1024 / 1024:.1f} MB')
except Exception as e:
    print(f'✗ Download failed: {e}')
    print('Trying curl fallback...')
    exit(1)
"
          # Fallback to curl if Python download fails
          if [ $? -ne 0 ]; then
            echo "Downloading with curl..."
            curl -L -o models/checkpoints/sd_tiny.safetensors \
              https://huggingface.co/segmind/sd-tiny/resolve/main/sd_tiny.safetensors
            echo "✓ Downloaded via curl"
          fi
        else
          echo "✓ Model already cached: models/checkpoints/sd_tiny.safetensors"
          ls -lh models/checkpoints/sd_tiny.safetensors
        fi
    
    - name: Validate generated nodes
      run: |
        python scripts/validate_generated_nodes.py
    
    - name: Run integration tests
      run: |
        # Run basic validation test
        python tests/test_comfy_nodes_basic.py
        
        # Run node instantiation tests
        python tests/test_node_instantiation.py
        
        # Run workflow tests
        python tests/test_comfy_workflows.py
    
    - name: Run integration test with sd-tiny (CPU)
      run: |
        # This is slow on CPU but validates the full pipeline
        timeout 300 python tests/test_integration_sd_tiny.py || echo "Test timed out (expected on CPU)"
      continue-on-error: true
      env:
        PYTORCH_ENABLE_MPS_FALLBACK: 1
    
    - name: Check package metadata generation
      run: |
        python scripts/update_package_metadata.py
        # Verify the metadata file was updated
        test -f src/nodetool/package_metadata/nodetool-comfy.json
